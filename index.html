<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FALCON EYE // TACTICAL HUD</title>
    <style>
        :root {
            --bg-dark: #070b0e;
            --panel-bg: #0e161c;
            --border-safe: #173a2c;
            --accent-safe: #00e676;
            --accent-safe-dim: rgba(0, 230, 118, 0.14);
            --border-alert: #ff1744;
            --accent-alert: #ff2a4b;
            --accent-alert-dim: rgba(255, 42, 75, 0.22);
            --text-main: #e6f1f5;
            --text-muted: #7c93a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Courier New", Courier, monospace, system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 14px;
            border: 3px solid var(--border-safe);
            transition: border-color 0.2s ease, background-color 0.2s ease;
            overflow-x: hidden;
        }

        body.alert-active {
            border-color: var(--border-alert);
            animation: screenPulse 0.75s infinite alternate;
        }

        @keyframes screenPulse {
            0% {
                background-color: #160408;
                box-shadow: inset 0 0 25px rgba(255, 23, 68, 0.35);
            }
            100% {
                background-color: #2b060e;
                box-shadow: inset 0 0 55px rgba(255, 23, 68, 0.7);
            }
        }

        .hud-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .header {
            background: var(--panel-bg);
            border: 1px solid #1d2d38;
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-safe);
        }

        body.alert-active .brand {
            color: var(--accent-alert);
        }

        .link-pill {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: var(--accent-safe-dim);
            color: var(--accent-safe);
            border: 1px solid rgba(0, 230, 118, 0.35);
            font-weight: 700;
        }

        .link-pill.offline {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border-color: rgba(255, 193, 7, 0.4);
        }

        .mode-banner {
            background: var(--panel-bg);
            border: 1px solid var(--border-safe);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        body.alert-active .mode-banner {
            border-color: var(--accent-alert);
            background: var(--accent-alert-dim);
        }

        .mode-label {
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .mode-value {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent-safe);
        }

        body.alert-active .mode-value {
            color: var(--accent-alert);
        }

        .status-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-safe);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: center;
        }

        body.alert-active .status-card {
            border-color: var(--accent-alert);
            background: rgba(45, 7, 15, 0.85);
        }

        .threat-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--accent-safe);
        }

        body.alert-active .threat-title {
            color: var(--accent-alert);
            animation: textBlink 0.45s infinite alternate;
        }

        @keyframes textBlink {
            from { opacity: 1; transform: scale(1); }
            to   { opacity: 0.65; transform: scale(1.03); }
        }

        .threat-sub {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* نافذة الصورة الفورية (كل 1 ثانية) */
        .feed-panel {
            background: var(--panel-bg);
            border: 1px solid #1d2d38;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        body.alert-active .feed-panel {
            border-color: var(--accent-alert);
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .feed-box {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #05080b;
            border: 1px solid #1b2a34;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #live-frame {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #feed-placeholder {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
            padding: 12px;
        }

        /* بوصلة الخطر */
        .compass-panel {
            background: var(--panel-bg);
            border: 1px solid #1d2d38;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.alert-active .compass-panel {
            border-color: var(--accent-alert);
        }

        .compass-ring {
            position: relative;
            width: 185px;
            height: 185px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 230, 118, 0.08) 0%, rgba(10, 18, 24, 0.95) 72%);
            border: 2px solid #243947;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.alert-active .compass-ring {
            background: radial-gradient(circle, rgba(255, 42, 75, 0.22) 0%, rgba(24, 6, 11, 0.95) 72%);
            border-color: var(--accent-alert);
        }

        .cardinal {
            position: absolute;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .cardinal.n { top: 6px; left: 50%; transform: translateX(-50%); color: var(--accent-safe); }
        .cardinal.s { bottom: 6px; left: 50%; transform: translateX(-50%); }
        .cardinal.e { right: 8px; top: 50%; transform: translateY(-50%); }
        .cardinal.w { left: 8px; top: 50%; transform: translateY(-50%); }

        .pointer-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(0deg);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 16px;
        }

        .arrow-indicator {
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-bottom: 24px solid var(--text-muted);
            transition: border-bottom-color 0.2s ease;
        }

        body.alert-active .arrow-indicator {
            border-bottom-color: var(--accent-alert);
        }

        .compass-center {
            z-index: 2;
            background: var(--bg-dark);
            border: 1px solid #2b4150;
            border-radius: 8px;
            padding: 5px 9px;
            text-align: center;
        }

        .angle-readout {
            font-size: 0.98rem;
            font-weight: 700;
        }

        .dir-readout {
            font-size: 0.74rem;
            color: var(--accent-safe);
            font-weight: 700;
            margin-top: 2px;
        }

        body.alert-active .dir-readout {
            color: var(--accent-alert);
        }

        /* المربعات الأربعة لإرسال الحروف إلى الـ Terminal */
        .keypad-panel {
            background: var(--panel-bg);
            border: 1px solid #1d2d38;
            border-radius: 12px;
            padding: 12px;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .key-btn {
            background: #132029;
            color: var(--text-main);
            border: 1px solid #294152;
            border-radius: 10px;
            padding: 16px 0;
            font-size: 1.25rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        .key-btn:active {
            transform: scale(0.94);
            background: var(--accent-safe);
            color: #05110b;
            border-color: var(--accent-safe);
        }

        .cmd-status {
            margin-top: 8px;
            font-size: 0.74rem;
            color: var(--text-muted);
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="hud-container">
        <div class="header">
            <div class="brand">FALCON EYE // A</div>
            <div id="conn-badge" class="link-pill">POLLING 500ms</div>
        </div>

        <div class="mode-banner">
            <div class="mode-label">SYSTEM MODE</div>
            <div id="mode-display" class="mode-value">MODE_A - SCANNING</div>
        </div>

        <div class="status-card">
            <div id="threat-title" class="threat-title">AREA CLEAR</div>
            <div id="threat-sub" class="threat-sub">No airborne target detected</div>
        </div>

        <div class="feed-panel">
            <div class="feed-header">
                <span>LIVE SNAPSHOT (1s)</span>
                <span id="img-time">--:--:--</span>
            </div>
            <div class="feed-box">
                <img id="live-frame" alt="Live Camera Frame">
                <div id="feed-placeholder">WAITING FOR LIVE FRAME...</div>
            </div>
        </div>

        <div class="compass-panel">
            <div class="compass-ring">
                <span class="cardinal n">N (0°)</span>
                <span class="cardinal e">E (90°)</span>
                <span class="cardinal s">S (180°)</span>
                <span class="cardinal w">W (270°)</span>

                <div id="pointer-wrapper" class="pointer-wrapper">
                    <div class="arrow-indicator"></div>
                </div>

                <div class="compass-center">
                    <div id="angle-display" class="angle-readout">0°</div>
                    <div id="dir-display" class="dir-readout">NONE</div>
                </div>
            </div>
        </div>

        <div class="keypad-panel">
            <div class="keypad-grid">
                <button type="button" class="key-btn" onclick="sendLetter('A')">A</button>
                <button type="button" class="key-btn" onclick="sendLetter('B')">B</button>
                <button type="button" class="key-btn" onclick="sendLetter('C')">C</button>
                <button type="button" class="key-btn" onclick="sendLetter('D')">D</button>
            </div>
            <div id="cmd-status" class="cmd-status">TAP A SQUARE TO SEND LETTER TO TERMINAL</div>
        </div>
    </div>

    <script>
        let wasDetected = false;

        function formatModeText(mode) {
            if (mode === "MODE_A") {
                return "MODE_A - SCANNING";
            }
            return mode || "STANDBY";
        }

        function triggerAlertVibration() {
            if ("vibrate" in navigator) {
                try {
                    navigator.vibrate([300, 100, 300]);
                } catch (e) {}
            }
        }

        async function sendLetter(letter) {
            const cmdEl = document.getElementById("cmd-status");
            try {
                const res = await fetch("/api/command", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ command: letter })
                });
                if (!res.ok) throw new Error("HTTP " + res.status);
                cmdEl.textContent = `SENT [${letter}] TO TERMINAL`;
            } catch (err) {
                cmdEl.textContent = `FAILED TO SEND [${letter}]`;
            }
        }

        function applyState(data) {
            const detected = Boolean(data.detected);
            const direction = data.direction || "None";
            const angle = Number.isFinite(Number(data.angle)) ? Number(data.angle) : 0;
            const mode = data.mode || "MODE_A";

            document.getElementById("mode-display").textContent = formatModeText(mode);
            document.getElementById("angle-display").textContent = `${angle}°`;
            document.getElementById("dir-display").textContent = detected ? direction.toUpperCase() : "NONE";

            const pointer = document.getElementById("pointer-wrapper");
            pointer.style.transform = `rotate(${detected ? angle : 0}deg)`;

            const titleEl = document.getElementById("threat-title");
            const subEl = document.getElementById("threat-sub");

            if (detected) {
                document.body.classList.add("alert-active");
                titleEl.textContent = "DRONE DETECTED!";
                subEl.textContent = `Target bearing: ${direction} (${angle}°)`;

                if (!wasDetected) {
                    triggerAlertVibration();
                }
            } else {
                document.body.classList.remove("alert-active");
                titleEl.textContent = "AREA CLEAR";
                subEl.textContent = mode === "MODE_A" ? "Active drone scan in progress" : "System in standby";
            }

            wasDetected = detected;

            const imgEl = document.getElementById("live-frame");
            const placeholderEl = document.getElementById("feed-placeholder");
            const imgTimeEl = document.getElementById("img-time");

            if (data.image) {
                imgEl.src = "data:image/jpeg;base64," + data.image;
                imgEl.style.display = "block";
                placeholderEl.style.display = "none";
                imgTimeEl.textContent = data.image_time || "--:--:--";
            }
        }

        async function pollStatus() {
            const badge = document.getElementById("conn-badge");
            try {
                const res = await fetch("/api/status", { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();

                badge.textContent = "LIVE LINK";
                badge.classList.remove("offline");
                applyState(data);
            } catch (err) {
                badge.textContent = "LINK LOST";
                badge.classList.add("offline");
            }
        }

        pollStatus();
        setInterval(pollStatus, 500);
    </script>
</body>
</html>
